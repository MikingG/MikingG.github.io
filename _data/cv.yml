    Experience:
      - company: Purdue University
        position: "Remote Intern — Repository Level Code Generation"
        location: West Lafayette, IN, USA
        start_date: 2024-10
        end_date: 2025-01
        summary: Supervised by Prof. Lin Tan
        highlights:
          - Formulated innovative strategies to enhance code generation techniques and designed preliminary toy experiments to validate their feasibility and effectiveness.
          - Developed an agent-based Retrieval-Augmented Generation (RAG) code generation framework to intelligently select retrieval depth and generate code for unknown APIs as supplementary context.

      - company: University of Notre Dame
        position: "Project Leader — REU: LLM-Orchestrated Bayesian Optimization for AutoML"
        location: Notre Dame, IN, USA
        start_date: 2024-04
        end_date: 2025-02
        summary: Supervised by Prof. Xiangliang Zhang
        highlights:
          - Led a comprehensive study on Bayesian optimization parameter selection, demonstrating how large language models (LLMs) can dynamically select appropriate components based on optimization iteration history and expert knowledge.
          - Utilized greedy algorithms and LLM analysis to automatically construct a high-quality dataset for Supervised Fine-Tuning (SFT) and Direct Preference Optimization (DPO).
          - Fine-tuned the open-source large language model Vicuna, achieving state-of-the-art (SOTA) performance that surpasses existing Bayesian optimization tools on the HPOBench benchmark.

      - company: Sun Yat-sen University
        position: "Co-first Author — RustEvo²: An Evolving Benchmark for API Evolution in LLM-based Rust Code Generation"
        location: Guangzhou, China
        start_date: 2024-09
        end_date: 2025-03
        summary: Supervised by Prof. Mingwei Liu
        highlights:
          - Introduced a two-phase framework, EvoEval, which synthesizes 588 API changes to construct the RustEvo² dataset, designed to evaluate LLMs' adaptability to evolving Rust APIs.
          - Revealed significant performance variations among SOTA LLMs, with an average success rate of 65.8% on stabilized APIs but only 38.0% on behavioral changes.
          - Demonstrated that knowledge cutoff dates strongly influence model performance, with models scoring 56.1% on pre-cutoff APIs compared to 32.5% on post-cutoff tasks.
          - Evaluated the effectiveness of RAG, showing it improves model performance by an average of 13.5% for APIs released after the model's training cutoff.

      - company: Sun Yat-sen University
        position: "Project Leader — SYSU Innovation Project: Code Search Optimization Techniques"
        location: Guangzhou, China
        start_date: 2024-02
        end_date: 2025-03
        summary: Supervised by Prof. Yanlin Wang
        highlights:
          - Completed a prestudy on the optimization of datasets based on large models and researched the cause of model misselection in code search, as well as existing errors in the dataset through error analysis.
          - "Conducted a survey of 102 experienced Python programmers, finding that developers typically reference 2.64 code examples per query and perform 8.31 code searches per day, motivating the need for a multi-choice code search benchmark."
          - Developed the first multi-agent annotator with 92.0% accuracy for code search dataset construction.
          - Constructed CoSQA+, the first benchmark designed for evaluating multi-choice code search.

      - company: Sun Yat-sen University
        position: "Key Member — SYSU Innovation Project: Gradient-free Federated Learning"
        location: Guangzhou, China
        start_date: 2022-12
        end_date: 2023-12
        summary: Supervised by Prof. Xiaoyu He
        highlights:
          - Developed a scalable federated learning framework that randomly selects clients, places the model server-side, trains clients client-side, and uploads the training results.
          - Benchmarked optimization methods such as gradient descent and minibatch-SGD on datasets like MNIST and RCV1 to evaluate their efficiency in logistic regression contexts.

